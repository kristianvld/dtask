name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for committed secrets
        run: docker run --rm --network none --cpus=1 --memory=512m -v "$PWD:/src:ro" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /src --redact --no-banner

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.x'

      - name: Setup golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          install-mode: binary

      - name: Run tests
        run: make test

      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Run lint
        run: make lint

      - name: Build binary
        run: make build

  docker-preflight-and-integration:
    runs-on: ubuntu-latest
    needs: test-lint-build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build multi-arch image (release preflight)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false

      - name: Build amd64 image for integration test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: dtask:ci
          provenance: false
          sbom: false

      - name: Run host/compose integration smoke test
        env:
          DTASK_IMAGE: dtask:ci
        run: |
          set -euo pipefail

          sudo rm -f /tmp/dtask-host-ok /tmp/dtask-host-user-ok /tmp/dtask-compose-ok
          compose_args=(--project-directory "$PWD" -f .github/integration/docker-compose.ci.yml)
          cleanup() {
            docker compose "${compose_args[@]}" down -v || true
            sudo rm -f /tmp/dtask-host-ok /tmp/dtask-host-user-ok /tmp/dtask-compose-ok
          }
          trap cleanup EXIT

          docker compose "${compose_args[@]}" up -d
          sleep 8
          docker compose "${compose_args[@]}" logs dtask

          test -f /tmp/dtask-host-ok
          test -f /tmp/dtask-host-user-ok
          test -f /tmp/dtask-compose-ok

      - name: Verify clear error without /host mount
        run: |
          set -euo pipefail
          out="$(docker run --rm \
            -e host.schedule=1s \
            -e host.run=host \
            -e host.cmd=true \
            dtask:ci 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -F "require /host mount"

      - name: Verify clear error when not root
        run: |
          set -euo pipefail
          out="$(docker run --rm \
            --user 1000:1000 \
            -v /:/host \
            -e host.schedule=1s \
            -e host.run=host \
            -e host.cmd=true \
            dtask:ci 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -F "require root for chroot"

      - name: Verify clear error when host shell is missing
        run: |
          set -euo pipefail
          out="$(docker run --rm \
            -v /:/host \
            -e host.schedule=1s \
            -e host.run=host \
            -e 'host.shell=/definitely-not-a-shell -lc' \
            -e host.cmd=true \
            dtask:ci 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -F 'shell "/definitely-not-a-shell" not found on host'

      - name: Verify clear error when compose label is missing
        run: |
          set -euo pipefail
          out="$(docker run --rm \
            -v /:/host \
            -e compose.schedule=1s \
            -e compose.run=compose \
            -e compose.cmd=true \
            dtask:ci 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -F "missing docker label com.docker.compose.project.working_dir"
